[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ossc"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pandas>=3", "marimo>=0.25", "pint>=0.24", "matplotlib>=3.11", "scikit-learn>=1.6", "scipy>=1.18", "h5py>=3.13", "tables>=3.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ossc" = ["external-spectra.csv"] 
